<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GongBoo Bible · 단체 학습 로그인</title>
  <style>
    :root{font-family:Inter,'Noto Sans KR','Malgun Gothic',sans-serif;background:#f4f8ff;color:#172033}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(15,23,42,.12)}p.eyebrow{margin:0 0 7px;color:#d97706;font-size:11px;font-weight:900;letter-spacing:.15em}h1{margin:0;font-size:28px}p.desc{color:#64748b;line-height:1.65}label{display:block;margin:16px 0 6px;font-size:13px;font-weight:800;color:#334155}input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #bfd0e5;border-radius:10px;background:#fff}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#f59e0b;color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{margin-top:15px;padding:11px 12px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-size:13px}.notice.error{background:#fff1f2;color:#b91c1c}.back{display:inline-block;margin-top:18px;color:#1d4ed8;text-decoration:none;font-size:13px;font-weight:800}.hint{font-size:12px;color:#64748b;margin-top:7px}
  </style>
</head>
<body>
  <main class="card"><p class="eyebrow">GONGBOO BIBLE · ORGANIZATION</p><h1>단체 학습 로그인</h1><p class="desc">단체를 선택하고 등록된 이름과 PIN을 입력하세요. PIN은 4자리 이상 숫자입니다.</p>
    <form id="groupLoginForm"><label for="organization">단체</label><select id="organization" required><option value="">단체 목록을 불러오는 중...</option></select><label for="memberName">이름</label><input id="memberName" required maxlength="100" autocomplete="username" placeholder="등록된 이름"><label for="memberPin">PIN</label><input id="memberPin" required inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="current-password" type="password" placeholder="4~12자리 숫자"><p class="hint">PIN을 잊은 경우 단체 관리자에게 재등록을 요청하세요.</p><button type="submit">학습 시작</button></form>
    <div id="notice" class="notice">단체 목록을 준비하고 있습니다.</div><a class="back" href="./login.html">일반 로그인으로 돌아가기</a>
  </main>
  <script src="./supabase-config.js?v=8.60-supabase-storage1"></script><script src="./supabase-auth.js?v=8.90-group-pin1"></script>
  <script>
  (function(){'use strict';var config=window.BIBLE_SUPABASE_CONFIG||{},base=String(config.url||'').replace(/\/+$/,''),key=String(config.publishableKey||''),notice=document.getElementById('notice'),select=document.getElementById('organization');function show(text,error){notice.textContent=text;notice.className='notice'+(error?' error':'')}async function publicRequest(path,body){var response=await fetch(base+path,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(body||{})});var data=await response.json().catch(function(){return {}});if(!response.ok)throw new Error(data.message||'요청을 처리하지 못했습니다.');return data}async function loadOrganizations(){try{var data=await publicRequest('/functions/v1/group-access',{action:'list_organizations'}),rows=data.organizations||[];select.innerHTML='<option value="">단체를 선택하세요</option>'+rows.map(function(row){return '<option value="'+String(row.id).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+String(row.organization_name).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</option>'}).join('');show('등록된 단체를 선택하세요.')}catch(error){select.innerHTML='<option value="">단체 목록을 불러오지 못했습니다</option>';show(error.message,true)}}document.getElementById('groupLoginForm').onsubmit=async function(event){event.preventDefault();var button=event.submitter,pin=document.getElementById('memberPin').value.trim();if(!/^\d{4,12}$/.test(pin)){show('PIN은 숫자 4~12자리로 입력하세요.',true);return}button.disabled=true;show('로그인하고 있습니다.');try{var data=await publicRequest('/functions/v1/group-access',{action:'login',organization_id:select.value,member_name:document.getElementById('memberName').value.trim(),pin:pin});window.BibleSupabaseAuth.adoptSession(data.session);window.location.replace('./index.html?v=8.90-group-pin1')}catch(error){show(error.message||'로그인하지 못했습니다.',true)}finally{button.disabled=false}};loadOrganizations()})();
  </script>
</body></html>
