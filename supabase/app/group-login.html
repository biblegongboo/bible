<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GongBoo Bible · 단체 로그인</title><style>:root{font-family:Inter,'Noto Sans KR',sans-serif;background:#f4f8ff;color:#172033}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(15,23,42,.12)}p{color:#64748b;line-height:1.65}label{display:block;margin:16px 0 6px;font-size:13px;font-weight:800}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #bfd0e5;border-radius:10px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#f59e0b;color:#fff;font-weight:900}.notice{margin-top:15px;padding:11px 12px;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-size:13px}.error{background:#fff1f2;color:#b91c1c}.back{display:inline-block;margin-top:18px;color:#1d4ed8}</style></head><body><main class="card"><small>GONGBOO BIBLE · ORGANIZATION</small><h1>단체 학습 로그인</h1><p>등록한 이메일 ID와 PIN을 입력하세요.</p><form id="f"><label>이메일 ID</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com"><label>PIN</label><input id="pin" type="password" required inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="current-password" placeholder="4~12자리 숫자"><button>학습 시작</button></form><div id="n" class="notice">이메일 ID로 로그인합니다.</div><a class="back" href="./login.html">일반 로그인으로 돌아가기</a></main><script src="./supabase-config.js"></script><script src="./supabase-auth.js"></script><script>(function(){var c=window.BIBLE_SUPABASE_CONFIG||{},b=String(c.url||'').replace(/\/+$/,''),k=String(c.publishableKey||''),n=document.getElementById('n');function msg(t,e){n.textContent=t;n.className='notice'+(e?' error':'')}document.getElementById('f').onsubmit=async function(e){e.preventDefault();var p=document.getElementById('pin').value.trim();if(!/^\d{4,12}$/.test(p)){msg('PIN은 숫자 4~12자리입니다.',true);return}try{msg('로그인하고 있습니다.');var r=await fetch(b+'/functions/v1/group-access',{method:'POST',headers:{apikey:k,'Content-Type':'application/json'},body:JSON.stringify({action:'login',login_email:document.getElementById('email').value.trim(),pin:p})}),d=await r.json().catch(function(){return{}});if(!r.ok)throw Error(d.message||'로그인하지 못했습니다.');window.BibleSupabaseAuth.adoptSession(d.session);location.replace('./index.html')}catch(x){msg(x.message,true)}}})();</script></body></html>
