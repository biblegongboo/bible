<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GongBoo Bible · Group Admin</title>
  <style>
    :root{font-family:Inter,'Noto Sans KR','Malgun Gothic',sans-serif;background:#f4f8ff;color:#172033}*{box-sizing:border-box}body{margin:0}.head{background:#15223d;color:#fff;padding:22px max(18px,calc((100vw - 1100px)/2));border-bottom:4px solid #38bdf8}.head p{margin:0 0 5px;color:#facc15;font-size:11px;font-weight:900;letter-spacing:.15em}.head h1{margin:0;font-size:clamp(24px,4vw,34px)}.head span{display:block;margin-top:7px;color:#cbd5e1}.wrap{width:min(1100px,calc(100% - 28px));margin:24px auto 48px}.notice{padding:14px 16px;border:1px solid #bfdbfe;border-radius:12px;background:#eff6ff;color:#1e3a8a;margin-bottom:18px}.notice.error{border-color:#fecaca;background:#fff1f2;color:#b91c1c}.grid{display:grid;grid-template-columns:minmax(280px,.82fr) minmax(0,1.45fr);gap:18px}.card{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(15,23,42,.07)}h2{margin:0 0 14px;font-size:20px}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:800;color:#334155}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #bfd0e5;border-radius:9px;padding:10px 11px;background:#fff;color:#172033}textarea{min-height:76px;resize:vertical}button{border:0;border-radius:9px;padding:10px 13px;background:#f59e0b;color:#fff;font-weight:900;cursor:pointer}button.secondary{background:#e8f0ff;color:#1d4ed8}button:disabled{opacity:.5;cursor:wait}.org-list{margin:16px 0 0;padding:0;list-style:none;max-height:500px;overflow:auto;border-top:1px solid #e2e8f0}.org-list button{display:block;width:100%;padding:13px 11px;text-align:left;border-radius:0;background:#fff;color:#172033;border-bottom:1px solid #e2e8f0}.org-list button.selected{background:#eaf3ff;color:#1d4ed8}.org-meta{display:block;margin-top:3px;font-size:12px;color:#64748b}.member-form{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}.member-list{margin-top:16px;border-top:1px solid #e2e8f0}.member{display:grid;grid-template-columns:minmax(120px,.8fr) minmax(180px,2fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e2e8f0}.member input{padding:8px}.member button{padding:8px 10px;font-size:12px}.empty{padding:24px 4px;color:#64748b}.org-heading{display:flex;gap:10px;justify-content:space-between;align-items:baseline}.badge{padding:5px 8px;border-radius:99px;background:#e8f0ff;color:#1d4ed8;font-size:12px;font-weight:900}.foot{margin-top:12px;font-size:12px;color:#64748b}@media(max-width:760px){.grid{grid-template-columns:1fr}.member-form,.member{grid-template-columns:1fr}.member button{width:100%}}
  </style>
</head>
<body>
  <header class="head"><p>GONGBOO BIBLE · ORGANIZATION</p><h1>단체 관리자</h1><span>단체명, 정원, 신도명, 비고를 관리합니다.</span></header>
  <main class="wrap"><div id="notice" class="notice">관리자 권한을 확인하고 있습니다.</div><div class="grid" id="adminApp" hidden>
    <section class="card"><h2>새 단체 만들기</h2><form id="orgForm"><label>단체명</label><input id="orgName" required maxlength="100" placeholder="예: 새빛교회"><label>총 사용자 수</label><input id="orgSeats" type="number" required min="1" max="100000" value="100"><label>단체 비고</label><textarea id="orgMemo" maxlength="2000" placeholder="담당 교역자, 교육 목적 등"></textarea><button type="submit">단체 만들기</button></form><h2 style="margin-top:28px">내 단체</h2><ul id="orgList" class="org-list"></ul></section>
    <section class="card"><div class="org-heading"><h2 id="selectedTitle">단체를 선택하세요</h2><span id="seatBadge" class="badge" hidden></span></div><div id="memberArea" hidden><form id="memberForm" class="member-form"><div><label>신도명</label><input id="memberName" required maxlength="100" placeholder="예: 김은혜"></div><div><label>비고</label><input id="memberMemo" maxlength="2000" placeholder="예: 청년부 · 새가족"></div><button type="submit">추가</button></form><div id="memberList" class="member-list"></div><p class="foot">신도명은 같은 단체 안에서 중복될 수 없습니다. 비고에는 민감한 개인정보를 적지 마세요.</p></div><div id="noOrg" class="empty">왼쪽에서 단체를 선택하거나 새로 만드세요.</div></section>
  </div></main>
  <script src="./supabase-config.js?v=8.60-supabase-storage1"></script><script src="./supabase-auth.js?v=8.83-logout1"></script>
  <script>
  (function(){'use strict';var config=window.BIBLE_SUPABASE_CONFIG||{},base=String(config.url||'').replace(/\/+$/,''),key=String(config.publishableKey||''),state={user:null,orgs:[],selected:null,members:[]};var notice=document.getElementById('notice'),app=document.getElementById('adminApp');function show(message,error){notice.textContent=message;notice.className='notice'+(error?' error':'')}async function request(path,body){var session=await window.BibleSupabaseAuth.getSession();if(!session||!session.access_token)throw new Error('로그인이 필요합니다.');var response=await fetch(base+path,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body||{})});var data=await response.json().catch(function(){return {}});if(!response.ok)throw new Error(data.message||data.error||'요청을 처리하지 못했습니다.');return data}function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function renderOrgs(){var list=document.getElementById('orgList');list.innerHTML=state.orgs.length?state.orgs.map(function(org){return '<li><button data-org="'+org.id+'" class="'+(state.selected&&state.selected.id===org.id?'selected':'')+'"><strong>'+esc(org.organization_name)+'</strong><span class="org-meta">'+org.member_count+' / '+org.seat_limit+' users</span></button></li>'}).join(''):'<li class="empty">아직 만든 단체가 없습니다.</li>';list.querySelectorAll('[data-org]').forEach(function(button){button.onclick=function(){selectOrg(button.dataset.org)}})}function renderMembers(){var selected=state.selected,area=document.getElementById('memberArea'),none=document.getElementById('noOrg'),title=document.getElementById('selectedTitle'),badge=document.getElementById('seatBadge'),list=document.getElementById('memberList');if(!selected){area.hidden=true;none.hidden=false;title.textContent='단체를 선택하세요';badge.hidden=true;return}area.hidden=false;none.hidden=true;title.textContent=selected.organization_name;badge.hidden=false;badge.textContent=selected.member_count+' / '+selected.seat_limit+' users';list.innerHTML=state.members.length?state.members.map(function(member){return '<div class="member" data-member="'+member.id+'"><input class="member-name" value="'+esc(member.member_name)+'"><input class="member-memo" value="'+esc(member.memo)+'"><button class="secondary save-member">Save</button></div>'}).join(''):'<div class="empty">등록된 신도가 없습니다.</div>';list.querySelectorAll('.save-member').forEach(function(button){button.onclick=async function(){var row=button.closest('.member');button.disabled=true;try{await request('/rest/v1/rpc/update_learning_organization_member',{p_member_id:row.dataset.member,p_member_name:row.querySelector('.member-name').value,p_memo:row.querySelector('.member-memo').value,p_active:true});show('신도 정보를 저장했습니다.');await loadMembers()}catch(e){show(e.message,true)}finally{button.disabled=false}}})}async function loadOrgs(){state.orgs=await request('/rest/v1/rpc/list_learning_organizations');if(state.selected){state.selected=state.orgs.find(function(o){return o.id===state.selected.id})||null}renderOrgs();renderMembers()}async function loadMembers(){if(!state.selected)return;state.members=await request('/rest/v1/rpc/list_learning_organization_members',{p_organization_id:state.selected.id});await loadOrgs()}async function selectOrg(id){state.selected=state.orgs.find(function(o){return o.id===id})||null;renderOrgs();renderMembers();try{await loadMembers()}catch(e){show(e.message,true)}}document.getElementById('orgForm').onsubmit=async function(event){event.preventDefault();var button=event.submitter;button.disabled=true;try{var created=await request('/rest/v1/rpc/create_learning_organization',{p_organization_name:document.getElementById('orgName').value,p_seat_limit:Number(document.getElementById('orgSeats').value),p_memo:document.getElementById('orgMemo').value});document.getElementById('orgForm').reset();document.getElementById('orgSeats').value=100;await loadOrgs();await selectOrg(created.id);show('단체를 만들었습니다.')}catch(e){show(e.message,true)}finally{button.disabled=false}};document.getElementById('memberForm').onsubmit=async function(event){event.preventDefault();if(!state.selected)return;var button=event.submitter;button.disabled=true;try{await request('/rest/v1/rpc/add_learning_organization_member',{p_organization_id:state.selected.id,p_member_name:document.getElementById('memberName').value,p_memo:document.getElementById('memberMemo').value});document.getElementById('memberForm').reset();await loadMembers();show('신도를 추가했습니다.')}catch(e){show(e.message,true)}finally{button.disabled=false}};(async function(){try{state.user=await window.BibleSupabaseAuth.restoreUser();if(!state.user||state.user.account_type!=='admin')throw new Error('이 화면은 관리자 계정만 사용할 수 있습니다.');app.hidden=false;show('관리자 모드가 준비되었습니다.');await loadOrgs()}catch(e){show(e.message,true)}})()})();
  </script>
</body></html>
