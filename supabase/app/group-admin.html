<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GongBoo Bible · 단체 관리자</title>
  <style>
    :root{font-family:Inter,'Noto Sans KR','Malgun Gothic',sans-serif;background:#f4f8ff;color:#172033}*{box-sizing:border-box}body{margin:0}.head{background:#15223d;color:#fff;padding:22px max(18px,calc((100vw - 1100px)/2));border-bottom:4px solid #38bdf8}.head p{margin:0 0 5px;color:#facc15;font-size:11px;font-weight:900;letter-spacing:.15em}.head h1{margin:0;font-size:clamp(24px,4vw,34px)}.head span{display:block;margin-top:7px;color:#cbd5e1}.wrap{width:min(1100px,calc(100% - 28px));margin:24px auto 48px}.notice{padding:14px 16px;border:1px solid #bfdbfe;border-radius:12px;background:#eff6ff;color:#1e3a8a;margin-bottom:18px}.notice.error{border-color:#fecaca;background:#fff1f2;color:#b91c1c}.grid{display:grid;grid-template-columns:minmax(280px,.82fr) minmax(0,1.45fr);gap:18px}.card{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(15,23,42,.07)}h2{margin:0 0 14px;font-size:20px}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:800;color:#334155}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #bfd0e5;border-radius:9px;padding:10px 11px;background:#fff;color:#172033}textarea{min-height:76px;resize:vertical}button{border:0;border-radius:9px;padding:10px 13px;background:#f59e0b;color:#fff;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.org-list{margin:16px 0 0;padding:0;list-style:none;max-height:500px;overflow:auto;border-top:1px solid #e2e8f0}.org-list button{display:block;width:100%;padding:13px 11px;text-align:left;border-radius:0;background:#fff;color:#172033;border-bottom:1px solid #e2e8f0}.org-list button.selected{background:#eaf3ff;color:#1d4ed8}.org-meta{display:block;margin-top:3px;font-size:12px;color:#64748b}.member-form{display:grid;grid-template-columns:1fr 1.25fr .8fr 1fr auto;gap:8px;align-items:end}.member-list{margin-top:16px;border-top:1px solid #e2e8f0}.member{display:grid;grid-template-columns:.55fr 1fr 1.3fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e2e8f0}.ready{font-size:12px;color:#15803d;font-weight:800}.empty{padding:24px 4px;color:#64748b}.badge{padding:5px 8px;border-radius:99px;background:#e8f0ff;color:#1d4ed8;font-size:12px;font-weight:900}.foot{margin-top:12px;font-size:12px;color:#64748b}@media(max-width:760px){.grid,.member-form,.member{grid-template-columns:1fr}.member-form button{width:100%}}
  </style>
</head><body>
<header class="head"><p>GONGBOO BIBLE · ORGANIZATION</p><h1>단체 관리자</h1><span>단체, 좌석, 회원 이름·이메일 ID·PIN·비고를 관리합니다.</span></header>
<main class="wrap"><div id="notice" class="notice">관리자 권한을 확인하고 있습니다.</div><div class="grid" id="adminApp" hidden>
<section class="card"><h2>새 단체 만들기</h2><form id="orgForm"><label>단체명</label><input id="orgName" required maxlength="100" placeholder="예: 새빛교회"><label>총 사용자 수</label><input id="orgSeats" type="number" required min="1" max="100000" value="100"><label>단체 비고</label><textarea id="orgMemo" maxlength="2000"></textarea><button type="submit">단체 만들기</button></form><h2 style="margin-top:28px">내 단체</h2><ul id="orgList" class="org-list"></ul></section>
<section class="card"><h2 id="selectedTitle">단체를 선택하세요 <span id="seatBadge" class="badge" hidden></span></h2><div id="memberArea" hidden><form id="memberForm" class="member-form"><div><label>신도명</label><input id="memberName" required maxlength="100" placeholder="예: 김성도"></div><div><label>이메일 ID</label><input id="memberEmail" type="email" required maxlength="254" autocomplete="email" placeholder="name@example.com"></div><div><label>PIN</label><input id="memberPin" required inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" type="password" placeholder="4~12자리"></div><div><label>비고</label><input id="memberMemo" maxlength="2000"></div><button type="submit">등록</button></form><div id="memberList" class="member-list"></div><p class="foot">이메일이 회원의 로그인 ID입니다. PIN은 화면과 DB에 평문으로 저장되지 않습니다. 이메일은 모든 단체에서 중복될 수 없습니다.</p></div><div id="noOrg" class="empty">왼쪽에서 단체를 선택하거나 새로 만드세요.</div></section>
</div></main>
<script src="./supabase-config.js"></script><script src="./supabase-auth.js"></script><script>
(function(){'use strict';var c=window.BIBLE_SUPABASE_CONFIG||{},base=String(c.url||'').replace(/\/+$/,''),key=String(c.publishableKey||''),s={orgs:[],org:null,members:[]},n=document.getElementById('notice');function msg(t,e){n.textContent=t;n.className='notice'+(e?' error':'')}function esc(v){return String(v||'').replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}async function rpc(name,body){var z=await window.BibleSupabaseAuth.getSession();if(!z?.access_token)throw Error('로그인이 필요합니다.');var r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+z.access_token,'Content-Type':'application/json'},body:JSON.stringify(body||{})}),d=await r.json().catch(function(){return{}});if(!r.ok)throw Error(d.message||d.error||'요청을 처리하지 못했습니다.');return d}async function edge(body){var z=await window.BibleSupabaseAuth.getSession();var r=await fetch(base+'/functions/v1/group-access',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+z.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(function(){return{}});if(!r.ok)throw Error(d.message||'회원 등록에 실패했습니다.');return d}function render(){var ol=document.getElementById('orgList');ol.innerHTML=s.orgs.map(function(o){return '<li><button data-id="'+o.id+'" class="'+(s.org?.id===o.id?'selected':'')+'"><b>'+esc(o.organization_name)+'</b><span class="org-meta">'+o.member_count+' / '+o.seat_limit+' users</span></button></li>'}).join('')||'<li class="empty">아직 단체가 없습니다.</li>';ol.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){s.org=s.orgs.find(function(o){return o.id===b.dataset.id});loadMembers()}});var on=!!s.org;document.getElementById('memberArea').hidden=!on;document.getElementById('noOrg').hidden=on;document.getElementById('selectedTitle').firstChild.textContent=on?s.org.organization_name:'단체를 선택하세요 ';var badge=document.getElementById('seatBadge');badge.hidden=!on;if(on)badge.textContent=s.org.member_count+' / '+s.org.seat_limit+' users';document.getElementById('memberList').innerHTML=s.members.map(function(m){return '<div class="member"><span>#'+(m.registration_number||'-')+'</span><b>'+esc(m.member_name)+'</b><span>'+esc(m.login_email||'이메일 없음')+'</span><span class="ready">'+(m.auth_ready?'PIN ready':'PIN missing')+'</span></div>'}).join('')||'<div class="empty">등록된 회원이 없습니다.</div>'}async function loadOrgs(){s.orgs=await rpc('list_learning_organizations',{});s.org=s.orgs.find(function(o){return o.id===s.org?.id})||s.orgs[0]||null;render();if(s.org)await loadMembers()}async function loadMembers(){if(!s.org)return;s.members=await rpc('list_learning_organization_members',{p_organization_id:s.org.id});render()}document.getElementById('orgForm').onsubmit=async function(e){e.preventDefault();try{var o=await rpc('create_learning_organization',{p_organization_name:orgName.value,p_seat_limit:Number(orgSeats.value),p_memo:orgMemo.value});s.org=o;e.target.reset();orgSeats.value=100;await loadOrgs();msg('단체를 만들었습니다.')}catch(x){msg(x.message,true)}};document.getElementById('memberForm').onsubmit=async function(e){e.preventDefault();var pin=memberPin.value.trim();if(!/^\d{4,12}$/.test(pin)){msg('PIN은 숫자 4~12자리입니다.',true);return}try{await edge({action:'create_member',organization_id:s.org.id,member_name:memberName.value,login_email:memberEmail.value,memo:memberMemo.value,pin:pin});e.target.reset();await loadOrgs();msg('이메일 ID 회원을 등록했습니다.')}catch(x){msg(x.message,true)}};(async function(){try{var u=await window.BibleSupabaseAuth.restoreUser();if(!u||u.account_type!=='admin')throw Error('이 화면은 본사 관리자 계정만 사용할 수 있습니다.');document.getElementById('adminApp').hidden=false;await loadOrgs();msg('관리자 모드가 준비되었습니다.')}catch(e){msg(e.message,true)}})()})();
</script></body></html>
