<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GongBoo · 단체·방 관리</title><style>
:root{font-family:Inter,'Noto Sans KR','Malgun Gothic',sans-serif;color:#172033;background:#f4f8ff}*{box-sizing:border-box}body{margin:0}.head{padding:20px max(16px,calc((100vw - 1080px)/2));background:#15223d;color:white;border-bottom:4px solid #38bdf8}.head p{margin:0 0 5px;color:#facc15;font-size:11px;font-weight:900;letter-spacing:.14em}.head h1{margin:0;font-size:clamp(22px,4vw,32px)}.wrap{width:min(1080px,calc(100% - 28px));margin:22px auto}.notice{padding:12px 14px;border:1px solid #bfdbfe;border-radius:11px;background:#eff6ff;color:#1e3a8a;margin-bottom:15px}.notice.error{border-color:#fecaca;background:#fff1f2;color:#b91c1c}.select,button,input,textarea{font:inherit}.select,input,textarea{width:100%;padding:10px;border:1px solid #bfd0e5;border-radius:9px;background:#fff}button{border:0;border-radius:9px;padding:10px 12px;background:#f59e0b;color:#fff;font-weight:900;cursor:pointer}button.secondary{background:#e8f0ff;color:#1d4ed8}button.danger{background:#e2e8f0;color:#334155}button:disabled{opacity:.5}.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dbeafe;border-radius:15px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.06)}h2{margin:0 0 12px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.list{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid #e2e8f0;max-height:390px;overflow:auto}.list li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #e2e8f0}.list li.selected{background:#eef6ff}.meta{font-size:12px;color:#64748b;display:block;margin-top:3px}.room-actions{display:flex;gap:6px}.member-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.hint{margin-top:12px;color:#64748b;font-size:12px;line-height:1.55}@media(max-width:740px){.grid{grid-template-columns:1fr}.top,.form{grid-template-columns:1fr}.top button{width:100%}}
</style></head><body><header class="head"><p>GONGBOO BIBLE · PAID ORGANIZATION</p><h1>단체 · 방 · 회원 배정</h1></header><main class="wrap"><div id="notice" class="notice">관리자 권한을 확인하고 있습니다.</div><section id="app" hidden><div class="top"><div><label>단체 선택</label><select id="organization" class="select"></select></div><button id="openAdmin" class="secondary">단체·회원 등록</button></div><div class="grid"><section class="card"><h2>방 관리 <span id="roomCount" class="meta"></span></h2><form id="roomForm" class="form"><div><label>방 이름</label><input id="roomName" required maxlength="100" placeholder="예: 청년부"></div><div><label>비고</label><input id="roomMemo" maxlength="1000" placeholder="예: 주일 오전반"></div><button type="submit">방 만들기</button></form><ul id="rooms" class="list"></ul></section><section class="card"><h2 id="memberTitle">방을 선택하세요</h2><div id="memberPane" hidden><form id="assignForm" class="member-form"><select id="memberSelect" class="select"></select><button type="submit">회원 배정</button></form><ul id="assigned" class="list"></ul><p class="hint">한 회원은 여러 방에 배정될 수 있지만 단체 좌석은 한 번만 사용합니다. 방을 보관하면 기존 성적 이력은 유지됩니다.</p></div><p id="memberEmpty" class="hint">왼쪽에서 방을 선택하면 회원을 배정할 수 있습니다.</p></section></div></section></main><script src="./supabase-config.js"></script><script src="./supabase-auth.js"></script><script>(function(){'use strict';var cfg=window.BIBLE_SUPABASE_CONFIG||{},base=String(cfg.url||'').replace(/\/+$/,''),key=String(cfg.publishableKey||''),state={orgs:[],org:null,rooms:[],room:null,members:[],assigned:[]};var note=document.getElementById('notice');function msg(t,e){note.textContent=t;note.className='notice'+(e?' error':'')}function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function rpc(name,body){var s=await window.BibleSupabaseAuth.getSession();if(!s?.access_token)throw new Error('로그인이 필요합니다.');var r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.message||d.error||'요청을 처리하지 못했습니다.');return d}function render(){var o=document.getElementById('organization');o.innerHTML=state.orgs.map(function(x){return '<option value="'+x.id+'">'+esc(x.organization_name)+' ('+x.member_count+'/'+x.seat_limit+')</option>'}).join('');if(state.org)o.value=state.org.id;document.getElementById('roomCount').textContent=state.org?(state.rooms.filter(function(r){return r.active}).length+' / '+state.org.room_limit+' active rooms'):'';document.getElementById('rooms').innerHTML=state.rooms.length?state.rooms.map(function(r){return '<li class="'+(state.room?.id===r.id?'selected':'')+'"><button class="secondary choose" data-id="'+r.id+'">'+esc(r.room_name)+'<span class="meta">'+r.member_count+' members · '+(r.active?'active':'archived')+'</span></button><span class="room-actions">'+(r.active?'<button class="danger archive" data-id="'+r.id+'">보관</button>':'')+'</span></li>'}).join(''):'<li class="hint">아직 방이 없습니다.</li>';document.querySelectorAll('.choose').forEach(function(b){b.onclick=function(){state.room=state.rooms.find(function(r){return r.id===b.dataset.id});loadAssigned()}});document.querySelectorAll('.archive').forEach(function(b){b.onclick=async function(){if(!confirm('이 방을 보관할까요? 성적 이력은 유지됩니다.'))return;try{await rpc('archive_learning_room',{p_room_id:b.dataset.id});state.room=null;await loadRooms();msg('방을 보관했습니다.')}catch(e){msg(e.message,true)}}});var pane=document.getElementById('memberPane'),empty=document.getElementById('memberEmpty');pane.hidden=!state.room;empty.hidden=!!state.room;document.getElementById('memberTitle').textContent=state.room?state.room.room_name+' · 회원 배정':'방을 선택하세요';if(!state.room)return;var assignedIds=new Set(state.assigned.map(function(m){return m.member_id}));document.getElementById('memberSelect').innerHTML=state.members.filter(function(m){return m.active&&!assignedIds.has(m.id)}).map(function(m){return '<option value="'+m.id+'">#'+(m.registration_number||'-')+' '+esc(m.member_name)+'</option>'}).join('')||'<option value="">배정할 회원이 없습니다</option>';document.getElementById('assigned').innerHTML=state.assigned.length?state.assigned.map(function(m){return '<li><span><strong>#'+(m.registration_number||'-')+' '+esc(m.member_name)+'</strong><span class="meta">'+esc(m.memo)+'</span></span><button class="danger unassign" data-id="'+m.member_id+'">해제</button></li>'}).join(''):'<li class="hint">이 방에 배정된 회원이 없습니다.</li>';document.querySelectorAll('.unassign').forEach(function(b){b.onclick=async function(){try{await rpc('remove_learning_room_member',{p_room_id:state.room.id,p_member_id:b.dataset.id});await loadAssigned();msg('회원 배정을 해제했습니다.')}catch(e){msg(e.message,true)}}})}async function loadOrgs(){state.orgs=await rpc('list_learning_organizations',{});state.org=state.orgs.find(function(x){return x.id===state.org?.id})||state.orgs[0]||null;render();if(state.org){await loadMembers();await loadRooms()}}async function loadMembers(){state.members=await rpc('list_learning_organization_members',{p_organization_id:state.org.id})}async function loadRooms(){state.rooms=await rpc('list_learning_rooms',{p_organization_id:state.org.id});state.room=state.rooms.find(function(r){return r.id===state.room?.id})||null;state.assigned=[];render()}async function loadAssigned(){state.assigned=await rpc('list_learning_room_members',{p_room_id:state.room.id});render()}document.getElementById('organization').onchange=async function(e){state.org=state.orgs.find(function(x){return x.id===e.target.value});state.room=null;await loadMembers();await loadRooms()};document.getElementById('roomForm').onsubmit=async function(e){e.preventDefault();try{await rpc('create_learning_room',{p_organization_id:state.org.id,p_room_name:document.getElementById('roomName').value,p_memo:document.getElementById('roomMemo').value});e.target.reset();await loadRooms();msg('방을 만들었습니다.')}catch(x){msg(x.message,true)}};document.getElementById('assignForm').onsubmit=async function(e){e.preventDefault();var id=document.getElementById('memberSelect').value;if(!id)return;try{await rpc('assign_learning_room_member',{p_room_id:state.room.id,p_member_id:id});await loadAssigned();msg('회원을 방에 배정했습니다.')}catch(x){msg(x.message,true)}};document.getElementById('openAdmin').onclick=function(){location.href='./group-admin.html'};(async function(){try{var u=await window.BibleSupabaseAuth.restoreUser();if(!u||u.account_type!=='admin')throw new Error('이 화면은 본사 관리자 계정만 사용할 수 있습니다.');document.getElementById('app').hidden=false;await loadOrgs();msg('단체 운영 관리 화면이 준비되었습니다.')}catch(e){msg(e.message,true)}})()})();</script></body></html>
