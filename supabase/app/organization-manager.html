<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GongBoo 단체 관리자</title><style>:root{font-family:Inter,'Noto Sans KR',sans-serif;color:#172033;background:#f4f8ff}*{box-sizing:border-box}body{margin:0}.head{padding:20px max(16px,calc((100vw - 1080px)/2));background:#15223d;color:#fff;border-bottom:4px solid #38bdf8}.head p{margin:0 0 5px;color:#facc15;font-size:11px;font-weight:900;letter-spacing:.14em}.head h1{margin:0;font-size:clamp(22px,4vw,32px)}.wrap{width:min(1080px,calc(100% - 28px));margin:22px auto}.notice{padding:12px 14px;border:1px solid #bfdbfe;border-radius:11px;background:#eff6ff;color:#1e3a8a;margin-bottom:15px}.notice.error{border-color:#fecaca;background:#fff1f2;color:#b91c1c}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #bfd0e5;border-radius:9px;background:#fff}button{border:0;border-radius:9px;padding:10px 12px;background:#f59e0b;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#e8f0ff;color:#1d4ed8}.danger{background:#e2e8f0;color:#334155}.top,.form,.assign{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dbeafe;border-radius:15px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.06)}h2{margin:0 0 12px;font-size:20px}.list{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid #e2e8f0;max-height:390px;overflow:auto}.list li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #e2e8f0}.choose{flex:1;text-align:left}.selected{background:#eef6ff}.meta{font-size:12px;color:#64748b;display:block;margin-top:3px}.hint{margin-top:12px;color:#64748b;font-size:12px;line-height:1.55}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:740px){.grid,.top,.form,.assign{grid-template-columns:1fr}}</style></head><body><header class="head"><p>GONGBOO BIBLE · ORGANIZATION ADMIN</p><h1>단체 관리자</h1></header><main class="wrap"><div id="notice" class="notice">단체 관리자 권한을 확인하고 있습니다.</div><section id="app" hidden><div class="top"><div><label>관리 단체</label><select id="organization"></select></div><button id="logout" class="secondary">로그아웃</button></div><div class="grid"><section class="card"><h2>회원 등록 <span id="seat" class="meta"></span></h2><form id="memberForm" class="form"><div><label>신도명</label><input id="memberName" required maxlength="100"></div><div><label>이메일 ID</label><input id="memberEmail" type="email" required maxlength="254" placeholder="name@example.com"></div><div><label>PIN</label><input id="memberPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" required></div><button>등록</button></form><ul id="members" class="list"></ul><p class="hint">재설정은 안전한 이메일 링크로 진행됩니다. PIN이나 비밀번호는 관리자 화면에 표시되지 않습니다.</p></section><section class="card"><h2>방 관리 <span id="roomCount" class="meta"></span></h2><form id="roomForm" class="form"><div><label>방 이름</label><input id="roomName" required maxlength="100"></div><div><label>비고</label><input id="roomMemo" maxlength="1000"></div><button>방 만들기</button></form><ul id="rooms" class="list"></ul><div id="assignment" hidden><h2 id="roomTitle" style="margin-top:16px"></h2><form id="assignForm" class="assign"><select id="memberSelect"></select><button>회원 배정</button></form><ul id="assigned" class="list"></ul></div></section></div></section></main><script src="./supabase-config.js"></script><script src="./supabase-auth.js"></script><script>(()=>{'use strict';const cfg=window.BIBLE_SUPABASE_CONFIG||{},base=String(cfg.url||'').replace(/\/+$/,''),key=String(cfg.publishableKey||''),s={orgs:[],org:null,members:[],rooms:[],room:null,assigned:[]},n=document.querySelector('#notice');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t,e=false){n.textContent=t;n.className='notice'+(e?' error':'')}async function ses(){const x=await window.BibleSupabaseAuth.getSession();if(!x?.access_token)throw Error('로그인이 필요합니다.');return x}async function rpc(name,body={}){const x=await ses(),r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,Authorization:'Bearer '+x.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'요청을 처리하지 못했습니다.');return d}async function edge(body){const x=await ses(),r=await fetch(base+'/functions/v1/group-access',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+x.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'처리하지 못했습니다.');return d}function render(){organization.innerHTML=s.orgs.map(o=>`<option value="${o.id}">${esc(o.organization_name)}</option>`).join('');organization.value=s.org?.id||'';seat.textContent=`${s.org.member_count} / ${s.org.seat_limit} users`;roomCount.textContent=`${s.rooms.filter(r=>r.active).length} / ${s.org.room_limit} active rooms`;members.innerHTML=s.members.map(m=>`<li><span><b>#${m.registration_number||'-'} ${esc(m.member_name)}</b><span class="meta">${esc(m.login_email||'')}</span></span><span class="actions"><button class="secondary reset" data-email="${esc(m.login_email||'')}">재설정</button><button class="danger del" data-id="${m.id}">삭제</button></span></li>`).join('')||'<li class="hint">등록된 회원이 없습니다.</li>';document.querySelectorAll('.reset').forEach(b=>b.onclick=async()=>{if(!confirm('이 회원에게 비밀번호 재설정 이메일을 보낼까요?'))return;try{await edge({action:'send_password_reset',organization_id:s.org.id,login_email:b.dataset.email});msg('비밀번호 재설정 이메일을 보냈습니다.')}catch(e){msg(e.message,true)}});document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('이 회원을 삭제할까요? 모든 방 배정도 해제됩니다.'))return;try{await edge({action:'delete_member',member_id:b.dataset.id});await load();msg('회원을 삭제했습니다.')}catch(e){msg(e.message,true)}});rooms.innerHTML=s.rooms.map(r=>`<li class="${s.room?.id===r.id?'selected':''}"><button class="secondary choose" data-id="${r.id}">${esc(r.room_name)}<span class="meta">${r.member_count} members · ${r.active?'active':'archived'}</span></button>${r.active?`<button class="danger archive" data-id="${r.id}">보관</button>`:''}</li>`).join('')||'<li class="hint">등록된 방이 없습니다.</li>';document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>{s.room=s.rooms.find(r=>r.id===b.dataset.id);loadAssigned()});document.querySelectorAll('.archive').forEach(b=>b.onclick=async()=>{if(!confirm('이 방을 보관할까요? 기존 성적과 이력은 유지됩니다.'))return;try{await rpc('archive_learning_room',{p_room_id:b.dataset.id});s.room=null;await load();msg('방을 보관했습니다.')}catch(e){msg(e.message,true)}});assignment.hidden=!s.room;if(!s.room)return;roomTitle.textContent=s.room.room_name+' · 회원 배정';const ids=new Set(s.assigned.map(m=>m.member_id));memberSelect.innerHTML=s.members.filter(m=>m.active&&!ids.has(m.id)).map(m=>`<option value="${m.id}">#${m.registration_number||'-'} ${esc(m.member_name)}</option>`).join('')||'<option value="">배정할 회원이 없습니다</option>';assigned.innerHTML=s.assigned.map(m=>`<li><span><b>#${m.registration_number||'-'} ${esc(m.member_name)}</b><span class="meta">${esc(m.login_email||'')}</span></span><button class="danger unassign" data-id="${m.member_id}">해제</button></li>`).join('')||'<li class="hint">이 방에 배정된 회원이 없습니다.</li>';document.querySelectorAll('.unassign').forEach(b=>b.onclick=async()=>{try{await rpc('remove_learning_room_member',{p_room_id:s.room.id,p_member_id:b.dataset.id});await loadAssigned();msg('회원 배정을 해제했습니다.')}catch(e){msg(e.message,true)}})}async function load(){s.orgs=await rpc('list_my_learning_organizations');s.org=s.orgs.find(o=>o.id===s.org?.id)||s.orgs[0];if(!s.org)throw Error('배정된 단체가 없습니다. 시스템 관리자에게 관리자 지정을 요청하세요.');s.members=await rpc('list_learning_organization_members',{p_organization_id:s.org.id});s.rooms=await rpc('list_learning_rooms',{p_organization_id:s.org.id});s.room=s.rooms.find(r=>r.id===s.room?.id)||null;s.assigned=[];render()}async function loadAssigned(){s.assigned=await rpc('list_learning_room_members',{p_room_id:s.room.id});render()}organization.onchange=async e=>{s.org=s.orgs.find(o=>o.id===e.target.value);s.room=null;await load()};memberForm.onsubmit=async e=>{e.preventDefault();const pin=memberPin.value.trim();if(!/^\d{4,12}$/.test(pin))return msg('PIN은 숫자 4~12자리입니다.',true);try{await edge({action:'create_member',organization_id:s.org.id,member_name:memberName.value,login_email:memberEmail.value,pin});e.target.reset();await load();msg('회원을 등록했습니다.')}catch(x){msg(x.message,true)}};roomForm.onsubmit=async e=>{e.preventDefault();try{await rpc('create_learning_room',{p_organization_id:s.org.id,p_room_name:roomName.value,p_memo:roomMemo.value});e.target.reset();await load();msg('방을 만들었습니다.')}catch(x){msg(x.message,true)}};assignForm.onsubmit=async e=>{e.preventDefault();if(!memberSelect.value)return;try{await rpc('assign_learning_room_member',{p_room_id:s.room.id,p_member_id:memberSelect.value});await loadAssigned();msg('회원을 방에 배정했습니다.')}catch(x){msg(x.message,true)}};logout.onclick=async()=>{await window.BibleSupabaseAuth.signOut();location.href='./login.html'};(async()=>{try{if(!await window.BibleSupabaseAuth.restoreUser())throw Error('로그인이 필요합니다.');app.hidden=false;await load();msg('단체 관리자 화면이 준비되었습니다.')}catch(e){msg(e.message,true)}})()})();</script></body></html>
