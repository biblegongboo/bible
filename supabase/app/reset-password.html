<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GongBoo 비밀번호 재설정</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8ff;font-family:Inter,'Noto Sans KR',sans-serif;color:#172033}.card{width:min(440px,calc(100% - 32px));padding:28px;background:#fff;border:1px solid #dbeafe;border-radius:16px;box-shadow:0 10px 28px rgba(15,23,42,.08)}h1{margin:0 0 8px;font-size:26px}p{color:#64748b;line-height:1.55}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;border-radius:10px;font:inherit}input{border:1px solid #bfd0e5}button{border:0;background:#f59e0b;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px;font-size:14px}.err{color:#b91c1c}.ok{color:#15803d}</style></head><body><main class="card"><h1>새 비밀번호 설정</h1><p>이메일로 받은 안전한 링크에서만 새 비밀번호를 설정할 수 있습니다.</p><form id="form"><input id="password" type="password" minlength="6" required placeholder="새 비밀번호 (6자 이상)"><input id="confirm" type="password" minlength="6" required placeholder="새 비밀번호 확인"><button>비밀번호 변경</button></form><div id="msg" class="msg"></div></main><script src="./supabase-config.js"></script><script src="./supabase-auth.js"></script><script>(()=>{const cfg=window.BIBLE_SUPABASE_CONFIG||{},base=String(cfg.url||'').replace(/\/+$/,''),key=String(cfg.publishableKey||''),msg=document.querySelector('#msg');const p=new URLSearchParams(location.hash.slice(1));const access=p.get('access_token'),refresh=p.get('refresh_token');function show(t,e=false){msg.textContent=t;msg.className='msg '+(e?'err':'ok')}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const a=password.value,b=confirm.value;if(a!==b)return show('새 비밀번호가 일치하지 않습니다.',true);if(!access||!refresh)return show('재설정 링크가 유효하지 않거나 만료되었습니다. 관리자에게 다시 요청하세요.',true);try{const r=await fetch(base+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:a})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error_description||'변경하지 못했습니다.');await window.BibleSupabaseAuth.adoptSession({access_token:access,refresh_token:refresh,expires_at:Math.floor(Date.now()/1000)+3600,user:d.user||{}});show('비밀번호를 변경했습니다. 이제 로그인할 수 있습니다.');setTimeout(()=>location.href='./login.html',1200)}catch(x){show(x.message,true)}}})()</script></body></html>
