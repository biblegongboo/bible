<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gongboo License Study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font:16px Arial,sans-serif}.app{max-width:980px;margin:auto;min-height:100vh;background:white}.head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#075ea8;color:white}.disabled{opacity:.32;pointer-events:none}.controls,.modes,.products,.nav,.set-picker{display:flex;gap:10px;flex-wrap:wrap;padding:14px 24px}.controls button,.modes button,.nav button,.set-picker>*{min-height:44px;border:1px solid #b8c8dc;border-radius:10px;background:#effaf6;padding:9px 18px;font-weight:800}.modes button.on{background:#075ea8;color:#fff}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.products button{min-height:150px;border:1px solid #cad7e6;border-radius:18px;background:#fff;text-align:left;padding:22px}.products strong{display:block;font-size:22px}.products span{display:block;margin-top:12px;color:#607087}#status{padding:0 24px;color:#607087}#resume{margin:0 24px;padding:14px;border:1px solid #f59e0b;border-radius:12px;background:#fffaf0;font-weight:800}article{margin:18px 24px;padding:26px;border:1px solid #cad7e6;border-radius:18px}.choices{display:grid;gap:10px}.choices button{text-align:left;padding:14px;border:1px solid #cad7e6;border-radius:12px;background:white}.choices span{display:block;margin:5px 0 0 28px;color:#516174}.choices .ok{border-color:#16834a;background:#ecfdf3}.choices .bad{border-color:#dc3545;background:#fff1f2}@media(max-width:600px){article{margin:10px;padding:16px}.set-picker>*{width:100%}}</style></head>
<body><main class="app"><header class="head"><b>Gongboo · License Study</b><div><button class="disabled" title="Bible only">Map</button> <button class="disabled" title="Bible only">People</button> <button>?</button></div></header>
