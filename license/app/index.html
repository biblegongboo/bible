<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gongboo License Study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#172033;font-family:Arial,sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #cbd5e1}.header{position:relative;background:linear-gradient(135deg,#09223e,#203a66);color:#fff;padding:18px 20px 15px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900}.brand em{color:#f5a623;font-style:normal}.icons{display:flex;gap:9px}.icon{width:42px;height:38px;border:1px solid #ffffff4d;border-radius:9px;background:#ffffff16;color:#fff;font-weight:800}.icon[disabled],.disabled{opacity:.3;cursor:not-allowed}.playback,.modebar{display:grid;gap:7px;margin-top:12px}.playback{grid-template-columns:repeat(5,minmax(0,1fr))}.modebar{grid-template-columns:repeat(7,minmax(0,1fr))}.playback button,.playback select,.modebar button,.modebar select{height:42px;border:0;border-radius:9px;background:#effaf6;color:#172033;font-weight:800;min-width:0}.modebar .active{background:#fff;color:#1d4ed8}.modebar select{padding:0 5px}.timer-toggle{position:absolute;right:18px;top:72px;width:42px;height:42px;border:1px solid #ffffff4d;border-radius:9px;background:#ffffff16;color:#fff;font-size:20px}.timer-panel{position:absolute;right:18px;top:120px;z-index:20;width:330px;padding:15px;border-radius:15px;background:#f8fafc;color:#172033;box-shadow:0 16px 42px #0005}.timer-head{display:flex;justify-content:space-between;font-weight:900}.timer-display{text-align:center;font:800 38px Consolas,monospace;margin:12px}.timer-inputs,.timer-actions{display:flex;gap:6px;justify-content:center}.timer-inputs input{width:52px;padding:9px;text-align:center}.timer-inputs button,.timer-actions button{padding:9px 12px;border:0;border-radius:8px;font-weight:800}.content{padding:20px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.products button{min-height:145px;border:1px solid #d2dbea;border-radius:18px;background:#fff;text-align:left;padding:22px;box-shadow:0 5px 14px #0f172a0c}.products strong{display:block;font-size:23px}.products span{display:block;margin-top:12px;color:#64748b}.status{color:#64748b}.setup{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #d7e0ed;border-radius:18px;padding:22px;text-align:center}.set-picker{display:grid;gap:10px}.set-picker>*{height:48px;border:1px solid #c6d3e4;border-radius:11px;padding:8px 14px;font-weight:800;background:#fff}.start{background:#f5a623!important;color:#fff;border:0!important}.resume{border-color:#f5a623!important;color:#f59e0b}.question-card{margin-top:20px;padding:25px;border:1px solid #cbd8e8;border-radius:18px}.question-line{font-size:21px;font-weight:800;line-height:1.35}.question-line.secondary{font-size:16px;font-weight:500;margin-top:16px}.choices{display:grid;gap:10px;margin-top:18px}.choices button{text-align:left;padding:15px;border:1px solid #cbd8e8;border-radius:12px;background:#fff}.choices span{display:block;margin:6px 0 0 28px;color:#516174}.choices .ok{border-color:#16834a;background:#ecfdf3}.choices .bad{border-color:#dc3545;background:#fff1f2}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.nav button{height:48px;border:0;border-radius:11px;color:#fff;font-weight:900;font-size:16px}.prev{background:#9dcdea}.skip{background:#f5a012}.next{background:#2ecc71}.quit{grid-column:1/-1;background:#ef493a!important}.tutor{margin-top:18px;padding:20px;border-top:2px solid #f5a623;border-radius:0 0 17px 17px;box-shadow:0 8px 25px #0f172a12}.tutor-head{display:flex;justify-content:space-between;align-items:center}.badge{border:1px solid #f5a623;border-radius:20px;padding:7px 11px;color:#a56300;font-size:12px}.tutor-row{display:flex;gap:10px;margin-top:12px}.tutor input{flex:1;border:2px solid #dde2e8;border-radius:28px;padding:13px 18px}.tutor button{border:0;border-radius:28px;padding:13px 24px;background:#f5a623;color:#fff;font-weight:800}.tutor-response{margin-top:12px;padding:17px;border-left:4px solid #f5a623;border-radius:14px;background:#f7f8fa;min-height:70px;white-space:pre-wrap}.hidden-line{display:none}.warning{color:#dc2626!important}@media(max-width:650px){.app{width:100%}.modebar{grid-template-columns:repeat(4,1fr)}.products,.setup{grid-template-columns:1fr}.content{padding:12px}.question-card{padding:16px}.tutor-row{flex-direction:column}.timer-panel{position:fixed;left:10px;right:10px;top:70px;width:auto}}
</style></head><body><main class="app">
<header class="header"><div class="top"><div class="brand">Lic | <em id="courseTitle">Study</em></div><div class="icons"><button class="icon" disabled title="Bible only">🌐</button><button class="icon" disabled title="Bible only">👤</button><button class="icon" disabled title="Coming later">?</button><button class="icon" id="exitTop" title="Courses">⇥</button></div></div>
<div class="playback"><button id="play">▶ Play</button><button id="replay">↻ Replay</button><button id="stop">■ Stop</button><select id="speed" aria-label="Reading speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select><button id="auto" aria-pressed="false">Auto OFF</button></div>
<div class="modebar"><button data-mode="Lrn">Lrn</button><button class="active" data-mode="Std">Std</button><button data-mode="Exm">Exm</button><button disabled>PSG</button><button disabled>Qz</button><select id="primaryLanguage" aria-label="First language"><option value="ENG">ENG</option><option value="KOR">KOR</option><option value="NONE">NONE</option></select><select id="secondaryLanguage" aria-label="Second language"><option value="KOR">KOR</option><option value="ENG">ENG</option><option value="NONE">NONE</option></select></div>
<button id="timerToggle" class="timer-toggle" hidden aria-label="Open timer">⏱</button><section id="timerPanel" class="timer-panel" hidden><div class="timer-head"><span>Timer</span><button id="timerClose">×</button></div><div id="timerDisplay" class="timer-display">00:00:00</div><div class="timer-inputs"><input id="timerHours" type="number" min="0" max="99" placeholder="HH"><b>:</b><input id="timerMinutes" type="number" min="0" max="59" placeholder="MM"><b>:</b><input id="timerSeconds" type="number" min="0" max="59" placeholder="SS"><button id="timerSet">Set</button></div><div class="timer-actions"><button id="timerStart">▶ Start</button><button id="timerReset">↺ Reset</button></div></section></header>
<div class="content"><section id="home"><h2>Available Subjects</h2><p>Select a subject to start.</p><div class="products"><button data-product="realestate"><strong>Real Estate</strong><span>150 questions per set · 20 free samples</span></button><button data-product="insurance"><strong>Insurance</strong><span>150 questions per set · 20 free samples</span></button><button data-product="mortgage"><strong>Mortgage NMLS</strong><span>120 questions per set · 20 free samples</span></button><button data-product="notary"><strong>Notary</strong><span>45 questions per set · 20 free samples</span></button></div></section>
<section id="quiz" hidden><p id="status" class="status"></p><div class="setup"><div class="card"><h3>NEW LESSON</h3><div class="set-picker"><select id="setSelect"></select><input id="questionJump" type="number" min="1"><button id="startSet" class="start">▶ START</button></div></div><div class="card"><h3>⌛ RESUME</h3><p>Continue previous session</p><button id="resume" class="set-picker resume" disabled>No saved session</button></div></div><div id="stage"></div><nav class="nav"><button id="prev" class="prev">◀ PREV (P)</button><button id="skip" class="skip">SKIP (S)</button><button id="next" class="next">NEXT (N)</button><button id="back" class="quit">× QUIT</button></nav>
<section class="tutor"><div class="tutor-head"><div><h3>💬 AI TUTOR</h3><small>Ask about the current question · subject-restricted tutor</small></div><span class="badge">Integrated Tutor</span></div><div class="tutor-row"><input id="tutorQuestion" placeholder="Ask about this question..."><button id="tutorSend">↵ Send</button></div><div id="tutorResponse" class="tutor-response">💡 Ask about the current license question.</div></section></section></div></main>
<script src="./config.js?v=2"></script><script type="module" src="./main.js?v=2"></script></body></html>
